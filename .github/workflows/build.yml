name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # 固定签名：每台新机器现生成的 debug key 都不同，覆盖安装会报 -7 签名不同；
      # 用 Secrets 里存的固定 debug.keystore 还原到 ~/.android/debug.keystore，之后所有构建签名一致。
      # 旧的临时密钥版（如 3.1.4）与固定签名版仍不同，需卸载一次重装，之后覆盖更新才通。
      - name: Restore fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Build debug APK
        run: ./gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suantangyu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 检查更新的数据源：每次构建后发一个公开 Release，网页点“检查更新”时查 releases/latest。
      # tag 用 v<versionName>-<run_number>，同版本号多次构建也不会撞 tag；网页比对时只取横杠前的版本号，
      # 所以壳发版必须同时升 versionName，否则同版本号的新构建不会被判为新版本。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk --title "酸汤鱼音乐 v${VERSION}" --generate-notes
